name: Extended catalogue checks

on:
  push:
    branches:
      - feature/extended-ios-device-catalog
      - ci/extended-ios-device-catalog
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup default 1.99.1
      - name: Test live and built-in firmware catalog
        run: cargo test -p lighttouch-catalog
      - name: Type-check desktop installer
        run: cargo check -p lighttouch
